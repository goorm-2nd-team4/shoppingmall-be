$kind: http-request
name: Update Member Role
method: PATCH
url: '{{baseUrl}}/api/admin/members/{{memberId}}/role'
order: 3000
pathVariables:
  - key: memberId
    value: '1'
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
body:
  type: json
  content: |-
    {
      "role": "ADMIN"
    }
