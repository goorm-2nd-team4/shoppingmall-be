spring:
  datasource:
    url: ${TEST_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/shoppingmall}}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:${user.name}}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: ${TEST_DB_DRIVER_CLASS_NAME:${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key}
  expiration: 86400000

app:
  admin:
    email: admin@test.com
    password: Admin1234!
    name: 테스트 관리자
