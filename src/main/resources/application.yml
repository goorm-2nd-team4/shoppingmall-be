spring:
  application:
    name: shoppingmall
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shoppingmall}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:abcd1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key}
  expiration: 86400000
