spring:
  application:
    name: shoppingmall
  datasource:
    url: jdbc:postgresql://localhost:5432/shoppingmall
    username: postgres
    password: abcd1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    time-zone: Asia/Seoul

jwt:
  secret: ${JWT_SECRET:test-secret-key-test-secret-key-test-secret-key}
  expiration: 86400000